<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standby – Hold the Castle: 28 nights without power</title>
<meta name="description" content="Hold your castle for 28 nights without power: walk through your home room by room with Ylva, close the gaps, and get plain guidance for water, warmth, food, health and communication. Works offline.">
<meta name="theme-color" content="#111a2c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Dark by default: saves battery on most phones. Printing switches to black on white. */
:root{--bg:#111a2c;--card:#1b263b;--ink:#f3eee4;--soft:#bcc3cf;--line:#34425e;--accent:#f3b04a;--accent-ink:#1a1200;
  --red:#ff8a7a;--amber:#f5c451;--green:#7dd8a4;--r:16px;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:680px;margin:0 auto;padding:10px 16px 48px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 8px}
header img{width:42px;height:42px;border-radius:11px}
header .name{flex:1;font-weight:700;font-size:1.2em;color:var(--ink);text-decoration:none;min-height:48px;display:flex;align-items:center}
.langs{display:flex;gap:4px}
button,.btn{min-height:48px;min-width:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1{font-size:1.45em;line-height:1.25;margin:8px 0 6px}
h2{font-size:1.12em;margin:22px 0 6px;color:var(--accent)}
.lead{color:var(--soft);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{margin-top:2px}.card ul{margin:0;padding-left:1.15em}.card li{margin:.35em 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:96px;color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere;hyphens:auto}
.tile .i{font-size:1.6em;line-height:1}.tile b{font-size:1em}.tile span{color:var(--soft);font-size:.85em;line-height:1.35}
.tile.big{grid-column:1/-1;border:2px solid var(--accent)}
.back{margin:6px 0}
.src{color:var(--soft);font-size:.85em}.src ul{padding-left:1.1em;margin:.3em 0}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:10px 0;padding:10px 14px 12px}
legend{font-weight:600;padding:0 4px}
.hint{color:var(--soft);font-size:.9em;margin:2px 0 6px}
label.opt{display:flex;align-items:center;gap:10px;min-height:46px;cursor:pointer}
input[type=radio]{width:22px;height:22px;accent-color:var(--accent);flex:none}
input[type=number],input[type=text],textarea{font:inherit;min-height:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=number]{width:7em}
textarea{min-height:96px}
.field{margin:10px 0}.field label{display:block;font-weight:600;margin-bottom:4px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9em}
.gap{border-left:6px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin:8px 0}
.gap.r{border-color:var(--red)}.gap.a{border-color:var(--amber)}.gap.g{border-color:var(--green)}
.tag{font-weight:700;font-size:.82em;letter-spacing:.03em}
.r .tag{color:var(--red)}.a .tag{color:var(--amber)}.g .tag{color:var(--green)}
.gap p{margin:4px 0}.gap a{color:var(--accent)}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}td.n{text-align:right;white-space:nowrap;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
details summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
footer{color:var(--soft);font-size:.85em;margin-top:28px}footer a{color:var(--accent)}
.note{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--soft);font-size:.9em}
/* chains, plan, to-dos */
.chains{display:grid;gap:6px;margin:12px 0 4px}
.chain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(5.5em,auto);align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-height:40px}
.chain .cn{font-weight:600;overflow-wrap:break-word;hyphens:auto}.chain .cl{color:var(--soft);font-size:.85em}
.bars{display:inline-grid;grid-template-columns:repeat(3,22px);gap:3px}.bars i{height:12px;border-radius:3px;background:var(--line)}
.bars.l1 i:nth-child(-n+1),.bars.l2 i:nth-child(-n+2),.bars.l3 i{background:var(--green)}
.bars.l1 i:first-child{background:var(--amber)}
.need{padding:10px 14px}.need .hint{margin:4px 0 0}
.verdict{border-width:6px}
.todos{list-style:none;padding:0;margin:8px 0}
.todo{border-left:6px solid var(--line);background:var(--card);border-radius:12px;margin:8px 0}
.todo.r{border-color:var(--red)}.todo.a{border-color:var(--amber)}
.todo label{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;cursor:pointer}
.todo input{width:24px;height:24px;margin-top:3px;flex:none;accent-color:var(--green)}
.todo .tt{display:block;margin-top:2px}.todo.done{opacity:.6}.todo.done .tt{text-decoration:line-through}
.print-only{display:none}
/* castle quest */
.hero{position:relative;margin:4px -16px 0;overflow:hidden}
.hero img{display:block;width:100%;height:auto;aspect-ratio:1280/714;object-fit:cover}
.hero .ht{position:absolute;left:0;right:0;top:0;padding:14px 18px 40px;background:linear-gradient(#0b1220ee,#0b122000)}
.hero h1{margin:0;font-size:1.9em;letter-spacing:.01em;text-shadow:0 2px 6px #000}
.hero p{margin:2px 0 0;color:var(--accent);font-weight:700;text-shadow:0 1px 4px #000}
.meter{background:var(--card);border:2px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin:14px 0}
.meter .big{font-size:2.4em;font-weight:800;line-height:1;color:var(--accent)}
.meter .big small{font-size:.42em;color:var(--soft);font-weight:600}
.moons{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:10px 0 6px}
.moons i{height:12px;border-radius:3px;background:var(--line)}.moons i.on{background:var(--accent)}
.mapbox{position:relative;max-width:520px;margin:8px auto;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.mapbox img{display:block;width:100%;height:auto}
.hot{position:absolute;display:flex;align-items:flex-end;justify-content:flex-start;padding:3px;border-radius:8px;text-decoration:none;border:2px solid transparent}
.hot:hover,.hot:focus-visible{border-color:var(--accent);background:#f3b04a22}
.hot span{font-size:13px;line-height:1.15;font-weight:700;padding:2px 6px;border-radius:6px;background:#0b1220d9;color:var(--ink);border-left:5px solid #8a93a3}
.st-r{--st:var(--red)}.st-a{--st:var(--amber)}.st-g{--st:var(--green)}.st-u{--st:#8a93a3}
.hot.st-r span,.hot.st-a span,.hot.st-g span{border-left-color:var(--st)}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.room{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--st);border-radius:12px;padding:8px 10px;min-height:64px;color:var(--ink);text-decoration:none;min-width:0}
.room b{display:block;font-size:.95em;line-height:1.2;overflow-wrap:break-word;hyphens:auto}.room small{color:var(--soft)}
.room .i{font-size:1.4em}
.badge{display:inline-block;font-weight:800;font-size:.8em;letter-spacing:.03em;padding:2px 10px;border-radius:999px;background:var(--st);color:#10141c}
.who{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:12px 0}
.who img{width:96px;height:96px;object-fit:contain;flex:none;background:#f6efe2;border-radius:12px}
.who p{margin:2px 0}
.roomimg{width:100%;height:auto;border-radius:var(--r);display:block;margin:8px 0;border:1px solid var(--line)}
.crew{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.crew figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.crew img{width:100%;height:170px;object-fit:contain;background:#f6efe2;border-radius:10px}
.crew figcaption{text-align:left;font-size:.9em;color:var(--soft)}.crew figcaption b{color:var(--ink);display:block;font-size:1.05em}
.wide{grid-column:1/-1}.wide img{height:auto;object-fit:cover}
.qroom{display:flex;gap:10px;align-items:center;margin:26px 0 4px}.qroom img{width:84px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.qroom h2{margin:0}
.knock{text-align:center}.knock img{width:160px;height:160px;object-fit:contain;background:#f6efe2;border-radius:14px}
@media (prefers-reduced-motion:no-preference){.knock img{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  :root{--bg:#fff;--card:#fff;--ink:#000;--soft:#333;--line:#999;--accent:#000;color-scheme:light}
  body{font-size:12pt}header,.langs,.back,.actions,footer,.noprint,nav.tiles,.hero,.mapbox,.who,.knock,.roomimg,.qroom img{display:none!important}
  .card,.gap{break-inside:avoid}.print-only{display:block}section.sec{break-before:page}section.sec:first-of-type{break-before:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icons/icon-192.png" alt="">
    <a class="name" href="#">Standby</a>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="de" lang="de">DE</button>
    </div>
  </header>
  <main id="app"></main>
  <footer>
    <p id="f1"></p>
    <p><a href="https://github.com/michaelwartmann/standby" id="f2"></a> · <a href="../" id="f3"></a></p>
  </footer>
</div>

<script src="content.js"></script>
<script src="quest.js"></script>
<script src="plan.js"></script>
<script>
"use strict";
/* ---------- texts ---------- */
const UI = {
  en: {
    tagline: "4 weeks without power. What you need, what to do, plainly.",
    homeIntro: "For a healthy household with children or without. Spartan, not prepper. Start with the check, then fix the gaps one by one.",
    check: "Walk the castle", checkSub: "20 questions → your gap list",
    ready: "Stock calculator", readySub: "Amounts for your household",
    card: "Communication card", cardSub: "Meeting point, channel, who to check on",
    all: "Everything to print", allSub: "Paper works when the phone is empty",
    back: "← Back", sources: "Sources", checked: "Checked",
    install: "Put it on your home screen", inst1: "Android (Chrome): menu ⋮ → “Install app” or “Add to Home screen”.",
    inst2: "iPhone (Safari): Share button □↑ → “Add to Home Screen”.", inst3: "After the first visit it works without internet.",
    f1: "Free, no ads, no account, no tracking. Not medical advice; do a first-aid course.", f2: "Source code (MIT)", f3: "More apps",
    print: "Print / save as PDF", showGaps: "Show my plan", gapsH: "Your gap list",
    R: "MISSING", A: "WEAK", G: "OK", allok: "No gaps. Check again every few months.",
    checkLead: "Answers stay on this phone. You can come back and change them any time.",
    readyLead: "Based on the BBK checklist (per person per 10 days), scaled to your household. Buy what you eat anyway.",
    adults: "Adults (14 and over)", kids: "Children (under 14)", days: "Days",
    foodH: "Food and drink", otherH: "Other things", rule: "Rule of thumb – check against your own use.",
    cardLead: "Fill it in now, agree on it with your neighbours, print it and stick it on the fridge.",
    c_meet: "Our meeting place", c_times: "Meeting times", c_point: "Nearest emergency point (Kat-Leuchtturm)", c_chan: "Walkie-talkie channel (PMR446)",
    c_people: "Who we check on", c_contacts: "Contact people and skills", c_water: "Nearest water point / emergency well",
    c_valves: "Our fuse box, main water valve, gas valve are at…",
    saved: "Saved on this phone.", reset: "Clear answers",
    cardTitle: "Our communication card",
    open: "Open",
  },
  de: {
    tagline: "4 Wochen ohne Strom. Was du brauchst, was zu tun ist, klar und einfach.",
    homeIntro: "Für einen gesunden Haushalt mit oder ohne Kinder. Spartanisch, nicht Prepper. Fang mit dem Check an und schließe dann die Lücken eine nach der anderen.",
    check: "Durch die Burg gehen", checkSub: "20 Fragen → deine Lückenliste",
    ready: "Vorrats-Rechner", readySub: "Mengen für deinen Haushalt",
    card: "Kommunikationskarte", cardSub: "Treffpunkt, Kanal, nach wem wir schauen",
    all: "Alles zum Drucken", allSub: "Papier geht, wenn der Akku leer ist",
    back: "← Zurück", sources: "Quellen", checked: "Geprüft",
    install: "Auf den Startbildschirm legen", inst1: "Android (Chrome): Menü ⋮ → „App installieren“ oder „Zum Startbildschirm“.",
    inst2: "iPhone (Safari): Teilen □↑ → „Zum Home-Bildschirm“.", inst3: "Nach dem ersten Besuch geht sie ohne Internet.",
    f1: "Kostenlos, ohne Werbung, ohne Konto, ohne Tracking. Keine medizinische Beratung; mach einen Erste-Hilfe-Kurs.", f2: "Quellcode (MIT)", f3: "Weitere Apps",
    print: "Drucken / als PDF speichern", showGaps: "Meinen Plan zeigen", gapsH: "Deine Lückenliste",
    R: "FEHLT", A: "SCHWACH", G: "OK", allok: "Keine Lücken. Alle paar Monate wieder prüfen.",
    checkLead: "Die Antworten bleiben auf diesem Handy. Du kannst jederzeit zurückkommen und sie ändern.",
    readyLead: "Nach der BBK-Checkliste (pro Person für 10 Tage), hochgerechnet auf deinen Haushalt. Kauf, was ihr sowieso esst.",
    adults: "Erwachsene (ab 14)", kids: "Kinder (unter 14)", days: "Tage",
    foodH: "Essen und Trinken", otherH: "Weitere Dinge", rule: "Faustregel – mit dem eigenen Verbrauch vergleichen.",
    cardLead: "Jetzt ausfüllen, mit den Nachbarn absprechen, ausdrucken und an den Kühlschrank hängen.",
    c_meet: "Unser Treffpunkt", c_times: "Uhrzeiten der Treffen", c_point: "Nächster Notfall-Treffpunkt (Kat-Leuchtturm)", c_chan: "Funkkanal (PMR446)",
    c_people: "Nach wem wir schauen", c_contacts: "Ansprechpersonen und Fähigkeiten", c_water: "Nächste Wasserstelle / Notbrunnen",
    c_valves: "Sicherungskasten, Hauptwasserhahn, Gashahn sind bei uns…",
    saved: "Auf diesem Handy gespeichert.", reset: "Antworten löschen",
    cardTitle: "Unsere Kommunikationskarte",
    open: "Öffnen",
  }
};

/* ---------- storage (this phone only) ---------- */
const KEY = "standby-v1";
const store = (() => { let d = {}; try { d = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {} return d; })();
store.ans = store.ans || {}; store.card = store.card || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
let lang = store.lang || ((navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2).toLowerCase()).find(l => UI[l]) || "en");
const t = k => UI[lang][k] || QUEST[lang][k] || UI.en[k] || QUEST.en[k] || k;
const L = o => (o && (o[lang] || o.en)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const ROOM = Object.fromEntries(ROOMS.map(r => [r.id, r]));
const SEC_ROOM = { water: "well", toilet: "well", food: "kitchen", warmth: "hearth", tech: "workshop", health: "herbs", comms: "hall", mind: "bard", light: "lantern" };
const LN = v => typeof v === "string" ? v : L(v);
const img = (name, alt, cls) => `<img src="art/${name}.webp" alt="${esc(alt || "")}"${cls ? ` class="${cls}"` : ""} loading="lazy" decoding="async">`;

/* ---------- questions and the chain engine live in plan.js ---------- */
const visible = q => !q.only || q.only(store.ans);
function gaps(a) { return assess(a).links; }

/* ---------- stock calculator (BBK checklist per person per 10 days) ---------- */
const STOCK = [
  { en: "Drinking water", de: "Trinkwasser", per10: 20, unit: "L" },
  { en: "Grains: rice, oats, pasta, crispbread, potatoes", de: "Getreide: Reis, Haferflocken, Nudeln, Knäckebrot, Kartoffeln", per10: 3.5, unit: "kg" },
  { en: "Vegetables and pulses: tins, jars, lentils", de: "Gemüse und Hülsenfrüchte: Dosen, Gläser, Linsen", per10: 4.0, unit: "kg" },
  { en: "Fruit and nuts: tins, dried fruit, nuts", de: "Obst und Nüsse: Dosen, Trockenobst, Nüsse", per10: 2.4, unit: "kg" },
  { en: "Milk and dairy: UHT milk, hard cheese", de: "Milch und Milchprodukte: H-Milch, Hartkäse", per10: 2.6, unit: "kg" },
  { en: "Fish, meat, eggs (or more pulses): tins", de: "Fisch, Fleisch, Eier (oder mehr Hülsenfrüchte): Dosen", per10: 1.5, unit: "kg" },
  { en: "Fat and oil", de: "Fett und Öl", per10: 0.36, unit: "kg" }
];
function otherStock(people, days) {
  const weeks = Math.ceil(days / 7);
  return [
    [{ en: "Gas cartridges for the camping stove", de: "Gaskartuschen für den Campingkocher" }, `~${Math.max(2, Math.ceil(weeks * (people <= 2 ? 1.5 : 2.5)))}`],
    [{ en: "Strong bin bags for the toilet", de: "Feste Müllbeutel für die Toilette" }, `~${people * days}`],
    [{ en: "Cat litter or sawdust", de: "Katzenstreu oder Sägespäne" }, `~${weeks * 10} L`],
    [{ en: "Toilet paper", de: "Toilettenpapier" }, `~${Math.ceil(people * days / 5)} ${lang === "de" ? "Rollen" : "rolls"}`],
    [{ en: "Headlamps", de: "Stirnlampen" }, `${people}`],
    [{ en: "Spare AA/AAA batteries", de: "Ersatzbatterien AA/AAA" }, `~${people * weeks * 4}`],
    [{ en: "Sleeping bags (comfort ~0 °C)", de: "Schlafsäcke (Komfort ~0 °C)" }, `${people}`],
    [{ en: "Water filter or disinfection tablets", de: "Wasserfilter oder Entkeimungstabletten" }, "1"],
    [{ en: "Power bank 20,000 mAh + solar panel 20–30 W", de: "Powerbank 20.000 mAh + Solarpanel 20–30 W" }, "1"],
    [{ en: "Crank or battery radio", de: "Kurbel- oder Batterieradio" }, "1"],
    [{ en: "Battery CO alarm, fire blanket", de: "CO-Melder mit Batterie, Löschdecke" }, "1 + 1"]
  ];
}

/* ---------- views ---------- */
const app = document.getElementById("app");
const backBtn = () => `<p class="back"><a class="btn" href="#">${t("back")}</a></p>`;
const tile = (href, icon, title, sub, big) => `<a class="tile${big ? " big" : ""}" href="${href}"><span class="i" aria-hidden="true">${icon}</span><b>${esc(title)}</b><span>${esc(sub)}</span></a>`;

/* ---------- castle: status and nights ---------- */
const answered = id => store.ans[id] !== undefined && store.ans[id] !== "";
const roomQs = id => ROOM_Q[id].filter(k => visible(QBY[k]));
function roomStatus(id, list) {
  const qs = roomQs(id), g = (list || gaps(store.ans)).filter(x => x.room === id);
  if (!qs.some(answered)) return "u";
  if (g.some(x => x.s === "r")) return "r";
  if (g.some(x => x.s === "a")) return "a";
  return qs.every(answered) ? "g" : "u";
}
// Nights the castle holds (plan.js): the shortest of water, food, warmth and toilet. Rough on purpose.
function nights() {
  if (!["treat", "food", "heating", "sleep", "toilet"].some(answered)) return null;
  return assess(store.ans).nights;
}
function weakestRoom(list) {
  const nt = nights(); if (nt && nt.weak) return nt.weak;
  const rank = { r: 0, a: 1 };
  const bad = ROOMS.map(r => [r.id, roomStatus(r.id, list)]).filter(x => x[1] in rank).sort((x, y) => rank[x[1]] - rank[y[1]]);
  return bad.length ? bad[0][0] : null;
}
function meterHTML(list) {
  const nt = nights(), w = weakestRoom(list), ready = ROOMS.filter(r => roomStatus(r.id, list) === "g").length;
  const ver = verdictHTML();
  if (!nt) return ver + `<div class="meter"><p style="margin:0 0 10px">${esc(t("unknown"))}</p><a class="btn primary" href="#check">${esc(t("walk"))} →</a></div>`;
  let h = ver + `<div class="meter" role="status"><div>${esc(t("holds"))}</div><div class="big">${nt.n} <small>${esc(t("nights"))} ${esc(t("of"))}</small></div>

const QBY = Object.fromEntries(Q.filter(q => q.id).map(q => [q.id, q]));

  return `<fieldset><legend>${esc(L(q))}</legend>${hint}${q.opts.map(o => `<label class="opt"><input type="radio" name="${q.id}" value="${o.v}"${store.ans[q.id] === o.v ? " checked" : ""}> ${esc(L(o))}</label>`).join("")}</fieldset>`;

function wireTodos(root) {

const CARD_FIELDS = ["c_meet", "c_times", "c_point", "c_chan", "c_water", "c_people", "c_contacts", "c_valves"];

function render() {
  const r = (location.hash || "#").slice(1);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("f1").textContent = t("f1"); document.getElementById("f2").textContent = t("f2"); document.getElementById("f3").textContent = t("f3");
  let title = "Standby";
  if (r === "check") { app.innerHTML = backBtn() + viewCheck(); title += " · " + t("check"); wireCheck(); }
  else if (r === "ready") { app.innerHTML = backBtn() + viewReady(); title += " · " + t("ready"); wireReady(); }
  else if (r === "card") { app.innerHTML = backBtn() + viewCard(); title += " · " + t("card"); wireCard(); }
  else if (r === "all") { app.innerHTML = backBtn() + viewAll(); title += " · " + t("all"); }
  else if (r.startsWith("room/") && ROOM[r.slice(5)]) { const id = r.slice(5); app.innerHTML = backBtn() + viewRoom(id) + backBtn(); title += " · " + L(ROOM[id].t); wireRoom(id); }
  else if (r === "plan") { app.innerHTML = backBtn() + `<section id="result">${resultHTML()}</section>` + backBtn(); title += " · " + t("planH"); wireTodos(document.getElementById("result")); }
  else if (r === "crew") { app.innerHTML = backBtn() + viewCrew() + backBtn(); title += " · " + t("crew"); }
  else if (SEC[r]) { app.innerHTML = backBtn() + sectionHTML(SEC[r]) + backBtn(); title += " · " + L(SEC[r].t); }
  else { app.innerHTML = viewHome(); title += " – " + t("hero"); document.getElementById("knockBtn").onclick = knock; }
  document.title = title;
}
function wireCheck() {
  const f = document.getElementById("qform"), res = document.getElementById("result");
  const upd = e => { if (!e.target.name) return; store.ans[e.target.name] = e.target.value; save();
    if (TRIGGERS.includes(e.target.name)) refreshForm(f, checkFormHTML, e.target);
    if (res.dataset.shown) res.innerHTML = resultHTML(); };
  wireTodos(res);
  f.addEventListener("change", upd); f.addEventListener("input", e => { if (e.target.type === "number") upd(e); });
  f.addEventListener("submit", e => { e.preventDefault(); res.dataset.shown = "1"; res.innerHTML = resultHTML(); res.scrollIntoView({ block: "start" }); res.querySelector("h2").setAttribute("tabindex", "-1"); res.querySelector("h2").focus({ preventScroll: true }); });
  if (store.shown) { res.dataset.shown = "1"; res.innerHTML = resultHTML(); }
  f.addEventListener("submit", () => { store.shown = true; save(); });
}
const TRIGGERS = ["power", "heating"];
function refreshForm(f, html, el) {
  const name = el.name, val = el.value, y = window.scrollY;
  f.innerHTML = html(); window.scrollTo(0, y);
  const again = f.querySelector(`[name="${name}"][value="${val}"]`); if (again) again.focus({ preventScroll: true });
}
function wireRoom(id) {
  const f = document.getElementById("qform"), r = ROOM[id];
  const upd = e => { if (!e.target.name) return; store.ans[e.target.name] = e.target.value; save();
    const list = gaps(store.ans), st = roomStatus(id, list);
    document.getElementById("rstatus").innerHTML = `<span class="badge st-${st}">${esc(stLabel(st))}</span>`;
    document.getElementById("rwho").innerHTML = whoHTML(r, st);
    document.getElementById("rgaps").innerHTML = roomGapsHTML(id, list);
    document.getElementById("rneed").innerHTML = needHTML(id);
    if (TRIGGERS.includes(e.target.name)) refreshForm(f, () => ROOM_Q[id].map(qField).join(""), e.target); };
  f.addEventListener("change", upd); f.addEventListener("input", e => { if (e.target.type === "number") upd(e); });
  f.addEventListener("submit", e => e.preventDefault());
}
function wireReady() {
  const f = document.getElementById("rform"), out = document.getElementById("rtable");
  const upd = () => { for (const n of ["adults", "kids", "days"]) store.ans[n] = f.elements[n].value; save(); out.innerHTML = readyTable(); };
  f.addEventListener("input", upd); f.addEventListener("submit", e => e.preventDefault()); out.innerHTML = readyTable();
}
function wireCard() {
  const f = document.getElementById("cform"), s = document.getElementById("csaved");
  f.addEventListener("input", e => { store.card[e.target.name] = e.target.value; save(); s.textContent = t("saved"); });
  f.addEventListener("submit", e => e.preventDefault());
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.lang = lang; save(); render(); });

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
